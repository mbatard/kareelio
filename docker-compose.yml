services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kareelio}
      POSTGRES_USER: ${POSTGRES_USER:-kareelio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kareelio} -d ${POSTGRES_DB:-kareelio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-kareelio}
      POSTGRES_USER: ${POSTGRES_USER:-kareelio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}
      SESSION_COOKIE_SAMESITE: "lax"
      SESSION_DURATION_HOURS: "72"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@kareelio.local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
      CORS_ORIGIN: http://localhost:5173
      DB_MIGRATE: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      REGISTRATION_ENABLED: "true"
      VERIFICATION_TOKEN_TTL_HOURS: "24"
      SMTP_HOST: ${SMTP_HOST:-}
      # Default to unauthenticated port-25 relay; set SMTP_USERNAME/PASSWORD only if your relay requires auth.
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      JOB_APPLICATIONS_BACKFILL: ${JOB_APPLICATIONS_BACKFILL:-false}
      JOB_APPLICATIONS_BACKFILL_DRY_RUN: ${JOB_APPLICATIONS_BACKFILL_DRY_RUN:-true}
      JOB_APPLICATIONS_REQUIRE_ENCRYPTED_READS: ${JOB_APPLICATIONS_REQUIRE_ENCRYPTED_READS:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
