apiVersion: v1
kind: Secret
metadata:
  name: kareelio-secret
  namespace: kareelio
type: Opaque
stringData:
  POSTGRES_USER: "kareelio"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME"
  DEFAULT_ADMIN_EMAIL: "admin@kareelio.local"
  DEFAULT_ADMIN_PASSWORD: "CHANGE_ME"
  SMTP_HOST: "CHANGE_ME"
  # Leave SMTP_USERNAME and SMTP_PASSWORD empty for an unauthenticated relay.
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  DATA_ENCRYPTION_KEY_ID: "primary"
  # Generate a 32-byte base64 key, for example: openssl rand -base64 32
  DATA_ENCRYPTION_KEY: "CHANGE_ME_BASE64_32_BYTES"
