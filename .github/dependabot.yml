version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - npm
    groups:
      frontend-runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: wednesday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
      - backend

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: wednesday
      time: "08:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
